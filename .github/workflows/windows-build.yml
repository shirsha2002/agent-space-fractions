name: Windows desktop build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Create pinned build environment
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned dependency installation failed.' }
      - name: Run offline agent tests
        env:
          PYTHONPATH: src
        run: |
          .\.venv\Scripts\python.exe -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Agent tests failed.' }
      - name: Build one-folder agent and verify bundled runner
        run: .\scripts\build_windows.ps1 -Bundle onedir
      - name: Build one-file agent and verify bundled runner
        run: .\scripts\build_windows.ps1 -Bundle onefile
      - name: Upload desktop build and smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Task1CodeAgent-Windows
          path: |
            dist/
            build/smoke-*/self_test_result.json
          if-no-files-found: error
          retention-days: 14

# No DeepSeek key or paid request is used by this workflow.
# A CI runner has Python installed; passing here does not prove clean-machine launch.
